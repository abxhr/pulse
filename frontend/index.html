<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Pulse - your body, instrumented</title>

    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0B0E14" />
    <link rel="icon" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pulse" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Instrument+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Set before first paint to avoid a light/dark flash on load.
      (function () {
        var saved = localStorage.getItem("pulse.theme");
        var theme = saved || "dark";
        if (theme === "light") document.documentElement.setAttribute("data-theme", "light");
        // One-time release cache cleanup. Authentication cookies are untouched.
        var release = "0.9.0";
        if (localStorage.getItem("pulse.release") !== release) {
          localStorage.setItem("pulse.release", release);
          if (window.caches) caches.keys().then(function (keys) {
            keys.filter(function (k) { return k.indexOf("pulse-") === 0; }).forEach(function (k) { caches.delete(k); });
          });
          if (navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (r) { r.update(); });
          });
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
